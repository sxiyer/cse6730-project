[project]
name = "cse6730-project"
version = "0.1.0"
description = "A rock-paper-scissor game simulation and analysis for CSE6730 course project."
readme = "README.md"
authors = [
    { name = "alozada7", email = "alozada7@gatech.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
]

[project.scripts]
cse6730-project = "cse6730_project:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
