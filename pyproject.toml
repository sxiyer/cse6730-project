[project]
name = "cse6730-project"
version = "0.1.0"
description = "A rock-paper-scissor game simulation and analysis for CSE6730 course project."
readme = "README.md"
authors = [
    { name = "alozada7", email = "alozada7@gatech.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "readchar>=4.2.1",
    "rich>=14.3.3",
    "ruff>=0.15.11",
    "scipy>=1.17.1",
]

[project.scripts]
cse6730-project = "cse6730_project:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
log_cli = true
log_cli_level = "DEBUG"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "directory-tree>=1.0.0",
    "pytest>=9.0.2",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
